name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          python build_windows.py

      - name: Prepare Distribution Package
        run: |
          New-Item -ItemType Directory -Force -Path dist_package | Out-Null
          Copy-Item "dist/TenutaTurritaQuoteManager.exe" -Destination "dist_package/TenutaTurritaQuoteManager.exe"
          Copy-Item "README.md" -Destination "dist_package/README.md"
          Compress-Archive -Path "dist_package/*" -DestinationPath "TenutaTurritaQuoteManager-Windows.zip" -Force

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenutaTurritaQuoteManager-Windows
          path: TenutaTurritaQuoteManager-Windows.zip
          retention-days: 30
          if-no-files-found: error

