name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onedir --name TenutaTurritaQuoteManager run_local.py --add-data "app;app" --add-data "data;data"

      - name: Copy README
        run: |
          copy README.md dist\TenutaTurritaQuoteManager\README.md

      - name: Create ZIP package
        run: |
          powershell Compress-Archive -Path dist\TenutaTurritaQuoteManager -DestinationPath TenutaTurritaQuoteManager-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenutaTurritaQuoteManager-windows
          path: TenutaTurritaQuoteManager-windows.zip
