name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Icon & Build Executable
        run: |
          python -c "from PIL import Image; img = Image.open('app/static/tenuta_turrita_logo.png'); img.save('app/static/app_icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          python build_windows.py

      - name: Prepare Distribution ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_package
          Copy-Item "dist/TenutaTurritaQuoteManager.exe" -Destination "dist_package/TenutaTurritaQuoteManager.exe"
          Copy-Item "README.md" -Destination "dist_package/README.md"
          Compress-Archive -Path "dist_package/*" -DestinationPath "TenutaTurritaQuoteManager-Windows.zip"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenutaTurritaQuoteManager-Windows
          path: TenutaTurritaQuoteManager-Windows.zip
          retention-days: 30
